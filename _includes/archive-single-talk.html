{% include base_path %}

<li class="talk-list__item" itemscope itemtype="http://schema.org/CreativeWork">
  <strong itemprop="name">{{ post.event | default: post.venue }}</strong>
  - <em itemprop="headline">"{{ post.title }}"</em>
  - {{ post.institution | default: post.location }}
  - {% if post.date_display %}{{ post.date_display }}{% elsif post.date %}{{ post.date | date: '%B %Y' }}{% endif %}
</li>

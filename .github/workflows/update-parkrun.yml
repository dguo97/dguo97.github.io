name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'   # Saturday 12:00 UTC
    - cron: '0 12 * * 0'   # Sunday 12:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Prevent overlapping runs
    concurrency:
      group: update-parkrun
      cancel-in-progress: true

    steps:
      # Checkout the branch explicitly to avoid detached HEAD
      - uses: actions/checkout@v3
        with:
          ref: new2          # change if your branch name differs
          fetch-depth: 0     # full history for rebase

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Parkrun update script
        run: python update_parkrun.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Ensure we are on the correct branch and track remote
          git checkout new2
          git branch --set-upstream-to=origin/new2

          # Rebase on latest remote commits
          git fetch origin new2
          git pull --rebase origin new2

          # Stage and commit changes
          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes to commit"

          # Safe force-push
          git push origin new2 --force-with-lease

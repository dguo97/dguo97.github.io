name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'  # Saturday 12:00 UTC
    - cron: '0 12 * * 0'  # Sunday 12:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checkout full history for safe rebase
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Install Playwright and dependencies
      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          python -m playwright install

      # Run the scraper
      - name: Run Parkrun update script
        run: python update_parkrun.py

      # Commit and push updated JSON
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes"
          git pull --rebase
          git push

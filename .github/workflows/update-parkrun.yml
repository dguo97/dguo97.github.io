name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'   # Saturday 12:00 UTC
    - cron: '0 12 * * 0'   # Sunday 12:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: update-parkrun
      cancel-in-progress: true

    steps:
      # Checkout the branch explicitly
      - uses: actions/checkout@v3
        with:
          ref: new2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # Ensure branch is in sync with remote
      - name: Reset branch to remote
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git fetch origin new2
          git checkout -B new2 origin/new2
          git reset --hard origin/new2

      # Run your script
      - name: Run Parkrun update script
        run: python update_parkrun.py

      # Commit and force-push changes
      - name: Commit and push
        run: |
          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes to commit"
          git push origin new2 --force

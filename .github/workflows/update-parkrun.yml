name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'   # Saturday 12:00 UTC
    - cron: '0 12 * * 0'   # Sunday 12:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Prevent overlapping runs
    concurrency:
      group: update-parkrun
      cancel-in-progress: true

    steps:
      # Check out the *branch* explicitly so we’re not in detached HEAD
      - uses: actions/checkout@v3
        with:
          ref: new2          # <<< replace with your branch name if different
          fetch-depth: 0     # full history so rebase works

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Parkrun update script
        run: python update_parkrun.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          BRANCH="new2"   # same branch as above; keep in sync

          # Make sure we have the latest remote commits
          git fetch origin $BRANCH
          git pull --rebase origin $BRANCH

          # Stage and commit if there are changes
          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes to commit"

          # Safe force-push to handle remote updates
          git push origin $BRANCH --force-with-lease

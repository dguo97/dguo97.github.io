name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'  # Saturday at 12:00 UTC
    - cron: '0 12 * * 0'  # Sunday at 12:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run Parkrun update script
        run: python update_parkrun.py



      - name: Commit and push safely
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          BRANCH="${GITHUB_REF##*/}"
          git fetch origin $BRANCH
          git checkout $BRANCH
          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes"
          git pull --rebase origin $BRANCH
          git push origin $BRANCH

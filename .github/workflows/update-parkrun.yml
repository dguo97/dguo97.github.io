name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'   # Saturday 12:00 UTC
    - cron: '0 12 * * 0'   # Sunday 12:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: update-parkrun
      cancel-in-progress: true

    steps:
      # Checkout the branch explicitly to avoid detached HEAD
      - uses: actions/checkout@v3
        with:
          ref: new2          # branch you want to update
          fetch-depth: 0     # full history for rebase or reset

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Hard reset branch to latest remote
        run: |
          git fetch origin new2
          git reset --hard origin/new2

      - name: Run Parkrun update script
        run: python update_parkrun.py

      - name: Commit and force-push updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes to commit"

          # Force-push to overwrite remote branch
          git push origin new2 --force

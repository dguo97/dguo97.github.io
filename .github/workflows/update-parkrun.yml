name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    concurrency:
      group: update-parkrun
      cancel-in-progress: true

    steps:
      # 1️⃣ Checkout branch (detached HEAD fix)
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # 3️⃣ Force-create local branch from remote
      - name: Prepare branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Delete local branch if exists
          git branch -D new2 || true
          
          # Create local branch from remote
          git fetch origin new2
          git checkout -B new2 origin/new2

      # 4️⃣ Run the script
      - name: Run Parkrun update script
        run: python update_parkrun.py

      # 5️⃣ Commit & force push
      - name: Commit and push
        run: |
          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes to commit"
          git push origin new2 --force

name: Update Parkrun JSON

on:
  schedule:
    - cron: '0 12 * * 6'  # Saturday 12:00 UTC
    - cron: '0 12 * * 0'  # Sunday 12:00 UTC
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update Parkrun JSON
        run: python update_parkrun.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/parkrun.json
          git commit -m "Update parkrun volunteer data" || echo "No changes"
          git pull --rebase
          git push
